{% extends "base.html" %}
{% block content %}
<h1>CSV 일괄 등록</h1>
<p>첫 줄은 제목(<code>영단어,뜻</code>)이고, 둘째 줄부터 단어와 뜻을 씁니다. UTF-8 인코딩, 20MB 이하.</p>
<p>이미 있는 단어(대소문자·공백 무시)와 파일 안에서 두 번째로 나온 같은 단어는 건너뜁니다. 먼저 나온 뜻을 씁니다.</p>
<form class="stack" method="post" action="/words/import" enctype="multipart/form-data">
  <input type="file" name="file" accept=".csv,text/csv" required>
  <button type="submit" class="primary">등록</button>
</form>
{% endblock %}
