{% extends "base.html" %}
{% block content %}
<h1>회원가입</h1>
<form class="stack" method="post" action="/signup">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>아이디 (영문, 숫자, 밑줄 3~20자) <input type="text" name="username" maxlength="20" required></label>
  <label>비밀번호 (8자 이상) <input type="password" name="password" minlength="8" required></label>
  <label>비밀번호 확인 <input type="password" name="confirm" minlength="8" required></label>
  <button type="submit" class="primary">가입하기</button>
</form>
<p>이미 계정이 있으신가요? <a href="/login">로그인</a></p>
{% endblock %}
